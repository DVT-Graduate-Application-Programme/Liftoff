name: Deploy Azure (development)

# Development deploys: every push to `development` rolls out to rg-liftoff-dev.
# The pipeline itself lives in deploy-azure.yml, shared with production.

on:
  push:
    branches: [development]
    paths:
      - 'backend/**'
      - 'worker/**'
      - 'frontend/**'
      - '.github/workflows/development-deploy-azure.yml'
      - '.github/workflows/deploy-azure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-azure.yml
    with:
      # Secrets resolve against the `development` GitHub Environment, falling back to
      # repository secrets — which is where they live today, so nothing needs moving for
      # this workflow to keep working. Move them into the environment when production gets
      # its own set, so the two can never be confused.
      environment_name: development
      image_tag_prefix: dev
      build_target: development
    secrets: inherit

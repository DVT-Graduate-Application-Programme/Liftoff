#    entrypoint: ["ollama", "pull", "gemma3:4b"] # To switch moddels just change gemma3:4b in the entrypoint . Fll list of available models at ollama.com/library.
#    environment:
#      OLLAMA_HOST: "http://ollama:11434"
#    depends_on:
#      ollama:
#        condition: service_healthy
#    restart: "no"

  backend:
    build: ./backend
    env_file:
      - .env.development
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Ollama__BaseUrl: "http://host.docker.internal:11434"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # SSE: tell the backend where to POST change notifications.
      # When the frontend runs in Docker (docker compose up) use the service name.
      # When the frontend runs locally (npm run dev) comment the line above and use:
      #   NOTIFICATIONS__NEXTJS__WEBHOOKURL: "http://host.docker.internal:3000/api/internal/notify"
      NOTIFICATIONS__NEXTJS__WEBHOOKURL: "http://frontend:3000/api/internal/notify"
      NOTIFICATIONS__NEXTJS__SHAREDSECRET: "${NOTIFICATIONS_SHARED_SECRET:-dev-secret-change-in-prod}"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  hiring-agent:
      build: ./backend/src/AI/hiring-agent
      env_file:
        - .env.development
      environment:
        BACKEND_BASE_URL: "http://backend:5000"
        OLLAMA_HOST: "http://host.docker.internal:11434"

      ports:
        - "8001:8001"
      depends_on:
        backend:
          condition: service_started

  frontend:
    build: ./frontend
    env_file:
      - .env.development
    environment:
      BACKEND_URL: "http://backend:5000"
      NEXT_PUBLIC_BACKEND_URL: "http://localhost:5000"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
  ollama_data:

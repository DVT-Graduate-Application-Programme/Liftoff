services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env.development
    # No init script: the schema comes from EF Core migrations
    # (backend/src/Infrastructure/Migrations), which the backend applies on startup in
    # Development. Deployed environments run the same migrations from a dedicated job.
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Azurite: Azure Blob Storage emulator (local dev only) ────────────────────
  # Backs the same "cvs"/"transcripts" containers the backend uses in Azure, so uploads
  # behave identically here. The named volume keeps CVs across `docker compose down`.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--blobPort", "10000", "--location", "/data"]
    volumes:
      - azurite_data:/data
    ports:
      - "10000:10000"

  # ── Azure Service Bus emulator (local dev only) ──────────────────────────────
  # Official emulator; needs a SQL Edge backing store. No Azure account required.
  # Connection string uses UseDevelopmentEmulator=true (plaintext AMQP on 5672).
  # On Apple Silicon, if the emulator fails to start, add: platform: linux/amd64
  sqledge:
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Str0ng!Passw0rd}"

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    volumes:
      - ./servicebus-emulator/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    ports:
      - "5672:5672"
      - "5300:5300"
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: sqledge
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Str0ng!Passw0rd}"
    depends_on:
      - sqledge


services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env.development
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "ls"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  ollama-init:
    image: ollama/ollama:latest
    entrypoint: ["ollama", "pull", "gemma3:4b"] # To switch moddels just change gemma3:4b in the entrypoint . Fll list of available models at ollama.com/library.
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    env_file:
      - .env.development
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Ollama__BaseUrl: "http://ollama:11434"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy

  frontend:
    build: ./frontend
    env_file:
      - .env.development
    environment:
      BACKEND_URL: "http://backend:5000"
      NEXT_PUBLIC_BACKEND_URL: "http://localhost:5000"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
  ollama_data:

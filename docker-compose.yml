  backend:
    build: ./backend
    env_file:
      - .env.development
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Local only. Applies EF Core migrations and seeds mock data on startup. Deployed
      # environments leave this unset and run migrations from a dedicated job — DbSeeder
      # truncates before seeding, so this must never be true against a real database.
      Database__AutoMigrateAndSeed: "true"
      Ollama__BaseUrl: "http://host.docker.internal:11434"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # SSE: URL where the backend POSTs data-change notifications.
      # Default assumes the frontend runs locally with npm run dev.
      # If running the frontend in Docker too (docker compose up --profile full), override:
      #   export NEXTJS_WEBHOOK_URL=http://frontend:3000/api/internal/notify
      NOTIFICATIONS__NEXTJS__WEBHOOKURL: "${NEXTJS_WEBHOOK_URL:-http://host.docker.internal:3000/api/internal/notify}"
      # Defaults to the local emulator; override with a real Azure connection string.
      SERVICEBUS_CONNECTION_STRING: "${SERVICEBUS_CONNECTION_STRING:-Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;}"
      # CVs and transcripts go to blob storage, never to the container filesystem. Defaults to
      # the Azurite emulator using its well-known public dev credentials; deployed environments
      # override this with the storage account's connection string.
      STORAGE_CONNECTION_STRING: "${STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;}"
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:-local-internal-key}"
      # No hiring agent URL here on purpose: the backend never calls the agent. Both ingest
      # and re-evaluate publish to the ingest queue and the worker owns the hand-off.
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      servicebus-emulator:
        condition: service_started
      azurite:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file:
      - .env.development
    environment:
      DOTNET_ENVIRONMENT: Development
      # Defaults to the local emulator; override with a real Azure connection string.
      SERVICEBUS_CONNECTION_STRING: "${SERVICEBUS_CONNECTION_STRING:-Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;}"
      # Bind the admin/health endpoints on all interfaces so they're reachable from the host.
      ASPNETCORE_URLS: "http://+:8080"
      # API key for the admin endpoints (X-Admin-Api-Key header). Set a real secret outside dev.
      Worker__AdminApiKey: "${WORKER_ADMIN_API_KEY:-local-dev-admin-key}"
      # Required — WorkerOptions has no default for it, so the worker refuses to start
      # without one rather than pointing at a host that may not exist. Deployed
      # environments set this to the agent's internal Container Apps URL.
      Worker__HiringAgentBaseUrl: "http://hiring-agent:8001"
      # Worker__QueueName overrides appsettings.json if needed.
    ports:
      - "8080:8080"
    depends_on:
      servicebus-emulator:
        condition: service_started
      hiring-agent:
        condition: service_started

  hiring-agent:
      build: ./backend/src/AI/hiring-agent
      env_file:
        - .env.development
      environment:
        BACKEND_BASE_URL: "http://backend:5000"
        OLLAMA_HOST: "http://host.docker.internal:11434"
        INTERNAL_API_KEY: "${INTERNAL_API_KEY:-local-internal-key}"

      ports:
        - "8001:8001"
      depends_on:
        backend:
          condition: service_started

  frontend:
    build: ./frontend
    env_file:
      - .env.development
    environment:
      BACKEND_URL: "http://backend:5000"
      NEXT_PUBLIC_BACKEND_URL: "http://localhost:5000"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
  azurite_data:
  ollama_data:
